# Cloudflare Worker config for feed-watch-bot.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "feed-watch-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Run every 15 minutes (cron times are UTC). Use e.g. "0 * * * *" for hourly.
[triggers]
crons = ["*/15 * * * *"]

# Remembers which feed items were already posted.
# Create it with:  npx wrangler kv namespace create SEEN
# then replace the placeholder below with the printed id.
[[kv_namespaces]]
binding = "SEEN"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Feeds to watch, one URL per line (RSS 2.0, RSS 1.0/RDF or Atom).
FEEDS = """
https://github.com/cloudflare/workers-sdk/releases.atom
"""
# Max new items posted per feed per run.
MAX_ITEMS_PER_FEED = "5"
# "false": the first check of a feed only remembers existing items (no flood of old posts).
POST_ON_FIRST_RUN = "false"
# Pause between Telegram messages (Telegram allows about 1 message per second per chat).
SEND_DELAY_MS = "1100"
# Max feeds a chat can add with /watch (fixed FEEDS above do not count).
MAX_FEEDS_PER_CHAT = "10"

# Secrets are NOT stored in this file. Set them with:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET   # random string; also used for /setup
# For local `npm run dev`, copy .dev.vars.example to .dev.vars (git-ignored).

[observability]
enabled = true
